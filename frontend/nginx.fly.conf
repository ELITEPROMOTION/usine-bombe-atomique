# Nginx config Fly.io — proxy /api/ vers backend public + SPA fallback
#
# Variables substituees par nginx-entrypoint au start (envsubst auto sur
# fichiers /etc/nginx/templates/*.template) :
#   ${NGINX_BACKEND_URL} -> https://uba-staging-api.fly.dev

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip pour bundle JS/CSS
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/xml text/xml application/atom+xml
               image/svg+xml font/woff2;

    # Headers securite
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Cache assets statiques (JS/CSS hashes -> immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API vers backend public Fly
    location /api/ {
        proxy_pass ${NGINX_BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host uba-staging-api.fly.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass ${NGINX_BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host uba-staging-api.fly.dev;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_read_timeout 3600s;
    }

    # SPA fallback : toute route inconnue -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint Fly
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
