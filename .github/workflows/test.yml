name: Test (V5.9)

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install ruff
        run: pip install --quiet ruff==0.6.9
      - name: Ruff check
        working-directory: backend
        run: ruff check app tests --output-format=github
      - name: Ruff format
        working-directory: backend
        run: ruff format --check app tests

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          pip install --quiet mypy==1.11.2
      - name: Mypy strict (app/)
        working-directory: backend
        run: mypy app --ignore-missing-imports --no-strict-optional || true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install --quiet bandit==1.7.10 safety==3.2.7
      - name: Bandit (app/, no tests)
        working-directory: backend
        run: bandit -r app -ll -x tests -f sarif -o bandit.sarif || bandit -r app -ll -x tests
      - name: Safety dependency audit
        working-directory: backend
        continue-on-error: true
        run: safety check --file requirements.txt --short-report

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: uba
          POSTGRES_USER: uba
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U uba" --health-interval=10s
          --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          pip install --quiet pytest-cov==5.0.0
      - name: Apply migrations
        env:
          PGPASSWORD: test-password
        run: |
          for f in backend/migrations/versions/*.sql; do
            echo "Applying $f"
            psql -h localhost -U uba -d uba -f "$f" -v ON_ERROR_STOP=1
          done
      - name: Pytest with coverage
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: uba
          POSTGRES_USER: uba
          POSTGRES_PASSWORD: test-password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-32-bytes-long-padding
          UBA_DATADOG_MODE: file
          UBA_SENTRY_MODE: file
          UBA_OTEL_EXPORTER: console
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term \
            --maxfail=5 --tb=short -q
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [tests, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,scope=backend-test,mode=max
          tags: uba-backend:test
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,scope=frontend-test,mode=max
          tags: uba-frontend:test

  frontend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
