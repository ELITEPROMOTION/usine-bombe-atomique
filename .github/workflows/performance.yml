name: Performance Benchmark (V5.9)

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: uba
          POSTGRES_USER: uba
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U uba" --health-interval=5s
          --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: uba
      POSTGRES_USER: uba
      POSTGRES_PASSWORD: test-password
      REDIS_HOST: localhost
      JWT_SECRET: ci-test-secret-32-bytes-long-padding
      UBA_DATADOG_MODE: file
      UBA_SENTRY_MODE: file
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        working-directory: backend
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          pip install --quiet pytest-benchmark==4.0.0
      - name: Apply migrations
        env:
          PGPASSWORD: test-password
        run: |
          for f in backend/migrations/versions/*.sql; do
            psql -h localhost -U uba -d uba -f "$f" -v ON_ERROR_STOP=1
          done
      - name: Run PR benchmark
        working-directory: backend
        continue-on-error: true
        run: |
          pytest tests/ -k "benchmark or perf" --benchmark-only \
            --benchmark-json=pr-bench.json --benchmark-warmup=on \
            --benchmark-min-rounds=5 || echo "no benchmark tests"
      - name: Checkout main baseline
        run: |
          git fetch origin main:main
          git stash --include-untracked || true
          git checkout main -- backend/
      - name: Run baseline benchmark
        working-directory: backend
        continue-on-error: true
        run: |
          pytest tests/ -k "benchmark or perf" --benchmark-only \
            --benchmark-json=baseline-bench.json --benchmark-warmup=on \
            --benchmark-min-rounds=5 || echo "no baseline tests"
      - name: Restore PR working tree
        run: git checkout HEAD -- backend/ && git stash pop || true
      - name: Compare p99 (fail if PR > +20%)
        working-directory: backend
        run: |
          python <<'EOF'
          import json, os, sys
          try:
              pr = json.load(open("pr-bench.json"))
              base = json.load(open("baseline-bench.json"))
          except FileNotFoundError:
              print("No benchmark data — skipping comparison")
              sys.exit(0)
          pr_b = {b["name"]: b["stats"] for b in pr.get("benchmarks", [])}
          base_b = {b["name"]: b["stats"] for b in base.get("benchmarks", [])}
          regressions = []
          for name, s in pr_b.items():
              if name not in base_b:
                  continue
              p99_pr = s.get("max", s.get("mean", 0)) * 1000
              p99_base = base_b[name].get("max", base_b[name].get("mean", 0)) * 1000
              if p99_base == 0:
                  continue
              delta = (p99_pr - p99_base) / p99_base * 100
              status = "OK" if delta <= 20 else "REGRESSION"
              print(f"{status:12} {name}: p99 {p99_base:.2f}ms -> {p99_pr:.2f}ms ({delta:+.1f}%)")
              if delta > 20:
                  regressions.append((name, delta))
          if regressions:
              print(f"\n::error::{len(regressions)} benchmark(s) regressed by >+20%:")
              for n, d in regressions:
                  print(f"  - {n}: +{d:.1f}%")
              sys.exit(1)
          print("\nAll benchmarks within +20% threshold")
          EOF
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            let body = '## Performance benchmark\n\n';
            try {
              const pr = JSON.parse(fs.readFileSync('backend/pr-bench.json'));
              const base = JSON.parse(fs.readFileSync('backend/baseline-bench.json'));
              body += `PR: ${pr.benchmarks?.length || 0} benchmarks · baseline: ${base.benchmarks?.length || 0}\n`;
            } catch (e) {
              body += `_No benchmark data collected_\n`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            backend/pr-bench.json
            backend/baseline-bench.json
          retention-days: 14
