# Production stack UBA - Hetzner CPX21 Nuremberg
# Difference vs docker-compose.yml :
#   - nginx en reverse-proxy SSL (Let's Encrypt via certbot companion)
#   - Ressources bornees (memory/cpu limits)
#   - Logs json-file avec rotation (max 50MB x 3 par service)
#   - No port externe postgres/redis/vault/sonarqube (bind 127.0.0.1)
#   - Grafana Cloud Agent collecte metrics -> remote_write
#   - Backup cron container (pg_dump + rclone vers Scaleway)
#   - Reseau isole `uba-prod` + restart: unless-stopped partout
#   - env_file: .env.production (a creer sur le VPS, jamais commit)

name: uba-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

networks:
  uba-prod:
    driver: bridge
  edge:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  vaultdata:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  certbot_data:
  certbot_www:
  nginx_cache:
  prom_agent_data:

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/versions:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks: [uba-prod]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 1.5g, cpus: "1.0" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: >
      sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks: [uba-prod]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 384m, cpus: "0.5" }
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    volumes:
      - vaultdata:/vault/file
    ports:
      - "127.0.0.1:8200:8200"
    networks: [uba-prod]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.3" }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health?standbyok=true | grep -q initialized || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:10.6-community
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ports:
      - "127.0.0.1:9000:9000"
    networks: [uba-prod]
    restart: unless-stopped
    logging: *default-logging
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits: { memory: 1.5g, cpus: "1.0" }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/api/system/status | grep -q -e UP -e DB_MIGRATION_NEEDED || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io/dendani}/uba-backend:${UBA_VERSION:-latest}
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      vault:    { condition: service_healthy }
    env_file: .env.production
    environment:
      ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      VAULT_ADDR: http://vault:8200
      SONAR_HOST_URL: http://sonarqube:9000
    networks: [uba-prod, edge]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.0" }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    image: ${DOCKER_REGISTRY:-ghcr.io/dendani}/uba-backend:${UBA_VERSION:-latest}
    build: ./backend
    depends_on:
      backend: { condition: service_healthy }
    env_file: .env.production
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      VAULT_ADDR: http://vault:8200
      SONAR_HOST_URL: http://sonarqube:9000
    command: ["arq", "app.worker.WorkerSettings"]
    networks: [uba-prod]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.0" }

  worker_automation:
    image: ${DOCKER_REGISTRY:-ghcr.io/dendani}/uba-backend:${UBA_VERSION:-latest}
    build: ./backend
    depends_on:
      backend: { condition: service_healthy }
    env_file: .env.production
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      VAULT_ADDR: http://vault:8200
      SONAR_HOST_URL: http://sonarqube:9000
      WORKER_NAME: worker_automation_1
    command: ["arq", "app.workers.arq_schedules.WorkerSettings"]
    networks: [uba-prod]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 768m, cpus: "0.75" }

  worker_automation_2:
    image: ${DOCKER_REGISTRY:-ghcr.io/dendani}/uba-backend:${UBA_VERSION:-latest}
    build: ./backend
    depends_on:
      backend: { condition: service_healthy }
    env_file: .env.production
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      VAULT_ADDR: http://vault:8200
      SONAR_HOST_URL: http://sonarqube:9000
      WORKER_NAME: worker_automation_2
    command: ["arq", "app.workers.arq_schedules.WorkerSettings"]
    networks: [uba-prod]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 768m, cpus: "0.75" }

  frontend:
    image: ${DOCKER_REGISTRY:-ghcr.io/dendani}/uba-frontend:${UBA_VERSION:-latest}
    build: ./frontend
    networks: [edge]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 128m, cpus: "0.25" }

  # ---------- Reverse-proxy SSL (Let's Encrypt via certbot) ----------
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - nginx_cache:/var/cache/nginx
    networks: [edge]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 128m, cpus: "0.25" }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c '
        trap exit TERM;
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
          sleep 12h & wait $$!;
        done
      '
    restart: unless-stopped
    logging: *default-logging

  # ---------- Backup (cron -> Scaleway) ----------
  backup:
    image: alpine:3.19
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env.production
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      SCW_ACCESS_KEY: ${SCW_ACCESS_KEY}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY}
      SCW_BUCKET: ${SCW_BUCKET:-uba-backups}
      SCW_ENDPOINT: ${SCW_ENDPOINT:-https://s3.fr-par.scw.cloud}
      SCW_REGION: ${SCW_REGION:-fr-par}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./deploy/scripts/backup.sh:/backup.sh:ro
      - ./deploy/scripts/restore.sh:/restore.sh:ro
    command: >
      sh -c '
        apk add --no-cache postgresql16-client rclone bash ca-certificates tzdata &&
        chmod +x /backup.sh /restore.sh &&
        echo "0 2 * * * /backup.sh >> /var/log/backup.log 2>&1" > /tmp/cron &&
        crontab /tmp/cron &&
        crond -f -l 8
      '
    networks: [uba-prod]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.25" }

  # ---------- Observability : Grafana Cloud Agent + exporters ----------
  # L'agent collecte node_exporter + cadvisor + postgres_exporter + redis_exporter
  # et remote_write vers Grafana Cloud.
  grafana-agent:
    image: grafana/agent:v0.40.3
    command: >
      -config.file=/etc/agent/agent.yml
      -metrics.wal-directory=/data/wal
      -server.http.address=0.0.0.0:12345
    volumes:
      - ./deploy/monitoring/agent.yml:/etc/agent/agent.yml:ro
      - prom_agent_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro,rslave
    env_file: .env.production
    networks: [uba-prod, edge]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.3" }
    pid: host

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    networks: [uba-prod]
    restart: unless-stopped
    logging: *default-logging
    pid: host
    deploy:
      resources:
        limits: { memory: 128m, cpus: "0.2" }

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [uba-prod]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 128m, cpus: "0.2" }

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }
    networks: [uba-prod]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 64m, cpus: "0.1" }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    networks: [uba-prod]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.3" }
