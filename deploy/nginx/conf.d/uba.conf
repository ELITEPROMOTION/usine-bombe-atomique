# ============================================================
# uba.dendani.dz - HTTPS prod vhost
# ============================================================

# HTTP -> HTTPS redirect + ACME challenge
server {
  listen 80;
  listen [::]:80;
  server_name uba.dendani.dz;

  # ACME challenge webroot
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /healthz { return 200 "ok\n"; }

  # All other traffic -> HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS main vhost
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name uba.dendani.dz;

  ssl_certificate     /etc/letsencrypt/live/uba.dendani.dz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/uba.dendani.dz/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/uba.dendani.dz/chain.pem;

  # Modern TLS config (Mozilla intermediate)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 1.0.0.1 valid=300s;
  resolver_timeout 5s;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' wss:; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;

  limit_conn conn 50;

  # Health endpoint (bypass rate limits)
  location /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # ----- Backend API -----
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ----- Login endpoint (strict rate limit) -----
  location = /api/v1/auth/login {
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ----- WebSocket -----
  location /ws {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ----- Docs (OpenAPI) -----
  location /docs     { proxy_pass http://backend:8000; }
  location /openapi.json { proxy_pass http://backend:8000; }

  # ----- Frontend (React SPA) -----
  location / {
    limit_req zone=general burst=120 nodelay;
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache api_cache;
    proxy_cache_valid 200 10m;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  # Deny sensitive paths
  location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
  location ~ /(\.env|\.git|docker-compose|Dockerfile) { deny all; }
}
