user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  # ---- Base ----
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ---- Logs ----
  log_format main '$remote_addr - $remote_user [$time_iso8601] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';
  access_log /var/log/nginx/access.log main;

  # ---- Perf ----
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  server_tokens off;
  client_max_body_size 20m;
  client_body_timeout 60s;
  reset_timedout_connection on;

  # ---- Gzip ----
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml application/json application/javascript
             application/xml+rss application/atom+xml image/svg+xml
             application/wasm font/ttf font/otf;

  # ---- Cache proxy ----
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                   max_size=256m inactive=10m use_temp_path=off;

  # ---- Rate limiting (DDoS + brute-force) ----
  limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;
  limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # ---- Real IP (Cloudflare) ----
  # Cloudflare IP ranges (IPv4 subset - list complete dans ./cloudflare_ips.conf)
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  include /etc/nginx/conf.d/*.conf;
}
