# Grafana Cloud Agent config - UBA prod
#
# Collecte metrics depuis node-exporter, cadvisor, postgres-exporter,
# redis-exporter, backend (FastAPI /metrics), puis remote_write vers
# Grafana Cloud.
#
# Variables env attendues (via env_file: .env.production) :
#   GRAFANA_CLOUD_PROM_URL        ex: https://prometheus-prod-01-eu-west-0.grafana.net/api/prom/push
#   GRAFANA_CLOUD_PROM_USER       ex: 1234567
#   GRAFANA_CLOUD_API_KEY         token Grafana Cloud
#   GRAFANA_CLOUD_LOKI_URL        optionnel - pour les logs
#   GRAFANA_CLOUD_LOKI_USER       optionnel

server:
  log_level: warn
  http_listen_address: 0.0.0.0
  http_listen_port: 12345

metrics:
  global:
    scrape_interval: 30s
    external_labels:
      env: production
      instance: hetzner-nbg1-cpx21
      service: uba
    remote_write:
      - url: ${GRAFANA_CLOUD_PROM_URL}
        basic_auth:
          username: ${GRAFANA_CLOUD_PROM_USER}
          password: ${GRAFANA_CLOUD_API_KEY}

  configs:
    - name: uba
      scrape_configs:
        - job_name: node
          static_configs:
            - targets: ['node-exporter:9100']

        - job_name: cadvisor
          static_configs:
            - targets: ['cadvisor:8080']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'container_(cpu|memory|network|fs)_.*'
              action: keep

        - job_name: postgres
          static_configs:
            - targets: ['postgres-exporter:9187']

        - job_name: redis
          static_configs:
            - targets: ['redis-exporter:9121']

        - job_name: backend
          metrics_path: /metrics
          static_configs:
            - targets: ['backend:8000']

        - job_name: nginx
          metrics_path: /metrics
          static_configs:
            - targets: ['nginx:80']
          # Requires nginx-prometheus-exporter sidecar if nginx OSS
          # (omitted here - use access.log parsed by Loki instead)

logs:
  configs:
    - name: uba
      clients:
        - url: ${GRAFANA_CLOUD_LOKI_URL:-}
          basic_auth:
            username: ${GRAFANA_CLOUD_LOKI_USER:-}
            password: ${GRAFANA_CLOUD_API_KEY:-}
      positions:
        filename: /data/positions.yaml
      scrape_configs:
        - job_name: docker
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              refresh_interval: 15s
          relabel_configs:
            - source_labels: ['__meta_docker_container_name']
              regex: '/(.*)'
              target_label: container
            - source_labels: ['__meta_docker_container_log_stream']
              target_label: stream
