name: uba

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  vault:
    extends:
      file: docker-compose.yml
      service: vault

  sonarqube:
    extends:
      file: docker-compose.yml
      service: sonarqube

  backend:
    extends:
      file: docker-compose.yml
      service: backend
    env_file:
      - .env
      - .env.local-prod

  worker:
    extends:
      file: docker-compose.yml
      service: worker
    env_file:
      - .env
      - .env.local-prod

  worker_automation:
    extends:
      file: docker-compose.yml
      service: worker_automation
    env_file:
      - .env
      - .env.local-prod

  worker_automation_2:
    extends:
      file: docker-compose.yml
      service: worker_automation_2
    env_file:
      - .env
      - .env.local-prod

  frontend:
    extends:
      file: docker-compose.yml
      service: frontend

  nginx-local:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/local/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/local/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  sonar_data:
  sonar_extensions:
  sonar_logs:
